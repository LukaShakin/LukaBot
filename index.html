<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LukaBot 🤖</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
}

header {
    text-align: center;
    padding: 25px;
    background: #111a33;
    border-bottom: 2px solid #26345c;
}

header h1 {
    margin: 0;
    font-size: 42px;
}

header p {
    margin-top: 8px;
    color: #9da9c9;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.status {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.status-box {
    background: #151f3d;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

.status-box h3 {
    margin: 0 0 10px;
}

.connected {
    color: #4cff72;
}

.panel {
    background: #151f3d;
    padding: 25px;
    border-radius: 20px;
    margin-bottom: 20px;
}

.panel h2 {
    margin-top: 0;
    text-align: center;
}

.remote {
    max-width: 400px;
    margin: auto;
    text-align: center;
}

.remote button {
    width: 90px;
    height: 70px;
    margin: 6px;
    border: none;
    border-radius: 15px;
    background: #263a70;
    color: white;
    font-size: 30px;
    cursor: pointer;
    transition: 0.15s;
}

.remote button:hover {
    background: #36529c;
}

.remote button:active {
    transform: scale(0.92);
}

.stop {
    background: #a92828 !important;
}

.stop:hover {
    background: #d13636 !important;
}

.modes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.mode-button {
    padding: 20px;
    border: none;
    border-radius: 15px;
    background: #263a70;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.mode-button:hover {
    background: #36529c;
}

.mode-button.active {
    outline: 3px solid white;
}

.message {
    text-align: center;
    font-size: 18px;
    color: #9da9c9;
    min-height: 25px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #6f7da3;
}

@media (max-width: 700px) {

    .status {
        grid-template-columns: 1fr;
    }

    .modes {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🤖 LukaBot</h1>
    <p>Robot Control Center</p>
</header>

<div class="container">

    <!-- STATUS -->
    <div class="status">

        <div class="status-box">
            <h3>Connection</h3>
            <div class="connected" id="connection">
                🟢 Connected
            </div>
        </div>

        <div class="status-box">
            <h3>Battery</h3>
            <div id="battery">
                🔋 87%
            </div>
        </div>

        <div class="status-box">
            <h3>Attachment</h3>
            <div id="attachment">
                📦 Ball Collector
            </div>
        </div>

    </div>

    <!-- REMOTE -->
    <div class="panel">

        <h2>🎮 Remote Control</h2>

        <div class="remote">

            <button
                onmousedown="move('forward')"
                onmouseup="stopRobot()"
                ontouchstart="move('forward')"
                ontouchend="stopRobot()">
                ▲
            </button>

            <br>

            <button
                onmousedown="move('left')"
                onmouseup="stopRobot()"
                ontouchstart="move('left')"
                ontouchend="stopRobot()">
                ◀
            </button>

            <button
                class="stop"
                onclick="stopRobot()">
                ■
            </button>

            <button
                onmousedown="move('right')"
                onmouseup="stopRobot()"
                ontouchstart="move('right')"
                ontouchend="stopRobot()">
                ▶
            </button>

            <br>

            <button
                onmousedown="move('backward')"
                onmouseup="stopRobot()"
                ontouchstart="move('backward')"
                ontouchend="stopRobot()">
                ▼
            </button>

        </div>

        <p class="message" id="message">
            Ready!
        </p>

    </div>

    <!-- MODES -->
    <div class="panel">

        <h2>⚙️ Robot Modes</h2>

        <div class="modes">

            <button
                class="mode-button active"
                onclick="setMode('remote', this)">
                🎮 Remote
            </button>

            <button
                class="mode-button"
                onclick="setMode('collector', this)">
                🏓 Ball Collector
            </button>

            <button
                class="mode-button"
                onclick="setMode('follow', this)">
                👣 Follow Mode
            </button>

        </div>

    </div>

    <!-- ATTACHMENT -->
    <div class="panel">

        <h2>📦 Attachment</h2>

        <div class="modes">

            <button
                class="mode-button"
                onclick="setAttachment('Ball Collector')">
                🏓 Ball Collector
            </button>

            <button
                class="mode-button"
                onclick="setAttachment('Robot Arm')">
                🦾 Robot Arm
            </button>

        </div>

    </div>

    <!-- ARM CONTROLS -->
    <div class="panel">

        <h2>🦾 Robot Arm</h2>

        <div class="remote">

            <button onclick="armMove('up')">
                ▲
            </button>

            <br>

            <button onclick="armMove('left')">
                ◀
            </button>

            <button onclick="armMove('grab')">
                ✋
            </button>

            <button onclick="armMove('right')">
                ▶
            </button>

            <br>

            <button onclick="armMove('down')">
                ▼
            </button>

        </div>

        <p class="message" id="armMessage">
            Arm ready
        </p>

    </div>

    <!-- BALL COLLECTOR -->
    <div class="panel">

        <h2>🏓 Ball Collector</h2>

        <div style="text-align:center">

            <button
                class="mode-button"
                onclick="collectBalls()">
                🏓 Collect Ball
            </button>

        </div>

        <p class="message" id="ballMessage">
            Collector ready
        </p>

    </div>

    <!-- EMERGENCY STOP -->
    <div class="panel">

        <button
            class="mode-button stop"
            style="width:100%;"
            onclick="emergencyStop()">
            🛑 EMERGENCY STOP
        </button>

    </div>

</div>

<footer>
    LukaBot © 2026 🤖
</footer>

<script>

let currentMode = "remote";
let currentAttachment = "Ball Collector";

function move(direction) {

    document.getElementById("message").textContent =
        "Moving " + direction + " 🚗";

    console.log("Robot movement:", direction);

    /*
        LATER:
        This is where we will send the command
        to the real robot.
    */
}

function stopRobot() {

    document.getElementById("message").textContent =
        "Stopped 🛑";

    console.log("Robot stopped");
}

function setMode(mode, button) {

    currentMode = mode;

    document.querySelectorAll(".mode-button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    if (mode === "remote") {
        document.getElementById("message").textContent =
            "Remote control activated 🎮";
    }

    if (mode === "collector") {
        document.getElementById("message").textContent =
            "Ball Collector mode activated 🏓";
    }

    if (mode === "follow") {
        document.getElementById("message").textContent =
            "Follow Mode activated 👣";
    }

    console.log("Mode:", mode);
}

function setAttachment(type) {

    currentAttachment = type;

    document.getElementById("attachment").textContent =
        "📦 " + type;

    document.getElementById("message").textContent =
        type + " attached!";
}

function armMove(action) {

    document.getElementById("armMessage").textContent =
        "Arm: " + action;

    console.log("Arm command:", action);
}

function collectBalls() {

    document.getElementById("ballMessage").textContent =
        "Collecting ball! 🏓";

    console.log("Collector activated");
}

function emergencyStop() {

    stopRobot();

    document.getElementById("message").textContent =
        "🛑 EMERGENCY STOP ACTIVATED";

    console.log("EMERGENCY STOP");
}

</script>

</body>
</html>
